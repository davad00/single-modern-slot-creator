<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works on notched phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e14" />
    <title>slot-client-template</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      /* Safe-area handling: the game mount avoids notches and home bars. */
      #game {
        position: fixed;
        inset: 0;
        padding-top: env(safe-area-inset-top, 0);
        padding-right: env(safe-area-inset-right, 0);
        padding-bottom: env(safe-area-inset-bottom, 0);
        padding-left: env(safe-area-inset-left, 0);
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Loading splash — removed by the boot script once Pixi is up. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0e14;
        z-index: 10;
        transition: opacity 300ms ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .ring {
        width: 56px;
        height: 56px;
        border: 4px solid #2c3242;
        border-top-color: #3a86ff;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring {
          animation: none;
          border-top-color: #2c3242;
        }
      }
      #splash .label {
        font-size: 14px;
        letter-spacing: 0.12em;
        color: #aab2c5;
      }
      #splash .error {
        color: #e0644f;
        font-size: 13px;
        max-width: 80%;
        text-align: center;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <style>
      /* Belladonna's Parlour: Blender-rendered parlour backdrop behind the canvas */
      body {
        background: #120d16 url('assets/backdrop.png') center 40% / cover no-repeat fixed;
      }
      #game canvas { opacity: 0.985; }
    </style>
    <div id="game"></div>
    <div id="splash">
      <div class="ring"></div>
      <div class="label">LOADING</div>
    </div>
    <script type="importmap">
      { "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.mjs" } }
    </script>
    <script type="module">
      const splash = document.getElementById('splash');
      try {
        const { bootstrapApp } = await import('./app.js');
        await bootstrapApp({ mount: document.getElementById('game') });
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 400);
      } catch (err) {
        console.error('[slot-template] boot failed', err);
        const message = document.createElement('div');
        message.className = 'error';
        message.textContent = `Boot failed: ${err?.message ?? err}`;
        splash.querySelector('.ring')?.remove();
        splash.appendChild(message);
      }
    </script>
  </body>
</html>
